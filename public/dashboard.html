<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f4f7fb;
      color: #111827;
      padding: 24px;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .dashboard,
    .admin-panel,
    .user-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(17, 24, 39, 0.12);
    }

    .dashboard {
      padding: 32px 24px;
      text-align: center;
      margin-bottom: 18px;
    }

    .admin-panel {
      display: none;
      padding: 24px;
    }

    h1 {
      color: #111827;
      font-size: 28px;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    h2 {
      color: #111827;
      font-size: 20px;
      margin-bottom: 6px;
    }

    p {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .user-list {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .user-card {
      padding: 16px;
    }

    .user-card.blocked {
      border-color: #fecdd3;
      background: #fff5f6;
    }

    .user-grid {
      display: grid;
      gap: 10px;
    }

    label {
      display: block;
      color: #374151;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: left;
    }

    input {
      width: 100%;
      height: 44px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 0 12px;
      font-size: 15px;
      color: #111827;
      background: #f9fafb;
      box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04);
    }

    input:focus {
      outline: none;
      border-color: #4f46e5;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.16);
    }

    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
      color: #111827;
      background: #f9fafb;
      box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04);
      min-height: 110px;
      resize: vertical;
      margin-bottom: 18px;
    }

    .post-form {
      margin-top: 24px;
      text-align: left;
    }

    .post-form label {
      display: block;
      color: #374151;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .post-form .form-group {
      margin-bottom: 18px;
    }

    .file-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 12px 14px;
      background: #ffffff;
      cursor: pointer;
      transition: border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
    }

    .file-input-wrapper:hover {
      border-color: #4f46e5;
      box-shadow: 0 10px 22px rgba(79, 70, 229, 0.12);
      transform: translateY(-1px);
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
    }

    .file-input-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 12px;
      background: #4f46e5;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      z-index: 1;
    }

    .file-name {
      color: #6b7280;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      z-index: 1;
    }

    .file-input-wrapper:hover .file-name {
      color: #4b5563;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (max-width: 640px) {
      .file-input-wrapper {
        flex-direction: column;
        align-items: stretch;
      }

      .file-input-button {
        width: 100%;
      }
    }

    .image-preview {
      width: 100%;
      max-width: 280px;
      min-height: 200px;
      margin: 0 auto 18px;
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
      background: linear-gradient(180deg, #ffffff 0%, #f9fafb 100%);
      display: none;
      overflow: hidden;
      text-align: center;
    }

    .image-preview img {
      max-width: 100%;
      max-height: 180px;
      display: inline-block;
      border-radius: 14px;
      object-fit: contain;
    }

    .image-preview.active {
      display: block;
    }

    .post-preview {
      margin-top: 24px;
      text-align: left;
    }

    .post-preview img {
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 14px;
      margin-bottom: 12px;
      display: block;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .posts-trailer {
      display: grid;
      gap: 10px;
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
      text-align: left;
    }

    .posts-trailer:hover {
      transform: translateY(-1px);
      border-color: #c7d2fe;
      box-shadow: 0 12px 24px rgba(79, 70, 229, 0.12);
    }

    .trailer-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .trailer-item {
      height: 68px;
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #e5e7eb;
    }

    .trailer-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .trailer-label {
      color: #374151;
      font-size: 13px;
      font-weight: 700;
      display: block;
    }

    .hidden {
      display: none !important;
    }

    .all-posts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .post-item {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
    }

    .post-item img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      object-fit: cover;
      margin-bottom: 12px;
    }

    .post-item .post-caption {
      margin: 0;
    }

    .post-item .post-author {
      margin-top: 10px;
      color: #6b7280;
      font-size: 12px;
    }

    .post-actions {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      align-items: center;
    }

    .post-action {
      width: 100%;
      max-width: 180px;
      min-height: 44px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      padding: 0 12px;
      font-size: 14px;
      background: #ffffff;
      color: #111827;
      cursor: pointer;
    }

    .post-action-label {
      color: #4b5563;
      font-size: 13px;
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .all-posts {
        grid-template-columns: 1fr;
      }

      .post-actions {
        flex-direction: column;
        align-items: stretch;
      }
    }
      .all-posts {
        grid-template-columns: 1fr;
      }
    }

    .post-caption {
      color: #374151;
      font-size: 15px;
      line-height: 1.6;
    }

    .meta {
      color: #6b7280;
      font-size: 13px;
      margin: 10px 0 0;
      text-align: left;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 4px 10px;
      border-radius: 999px;
      color: #ffffff;
      background: #16a34a;
      font-size: 12px;
      font-weight: 700;
      margin-top: 12px;
    }

    .status.blocked {
      background: #e11d48;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button,
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 46px;
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
      border: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.28);
      background: #4f46e5;
      text-decoration: none;
      transition: all 150ms ease-in-out;
    }

    #logoutLink {
      width: auto;
      max-width: none;
      margin: 0;
      padding: 12px 24px;
      align-self: flex-start;
    }

    .dashboard-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .dashboard-top h1 {
      margin: 0;
    }

    button:hover,
    a:hover {
      filter: brightness(1.05);
    }

    button:active,
    a:active {
      transform: scale(.95);
    }

    .danger {
      background: #e11d48;
      box-shadow: 0 10px 20px rgba(225, 29, 72, 0.24);
    }

    .warning {
      background: #f59e0b;
      box-shadow: 0 10px 20px rgba(245, 158, 11, 0.24);
    }

    .success {
      background: #16a34a;
      box-shadow: 0 10px 20px rgba(22, 163, 74, 0.24);
    }

    .notification {
      position: fixed;
      top: 18px;
      left: 50%;
      width: calc(100% - 32px);
      max-width: 390px;
      padding: 14px 16px;
      border-radius: 14px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      background: #4f46e5;
      box-shadow: 0 18px 45px rgba(17, 24, 39, 0.18);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -18px);
      transition: opacity 180ms ease, transform 180ms ease;
      z-index: 10;
    }

    .notification.error {
      background: #e11d48;
    }

    .notification.success {
      background: #16a34a;
    }

    .notification.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (min-width: 640px) {
      .user-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 16px;
      }

      .dashboard,
      .admin-panel {
        padding: 24px 18px;
      }

      h1 {
        font-size: 25px;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script src="/browser-image-compression.js"></script>
</head>
<body>
  <div id="notification" class="notification"></div>

  <div class="page">
    <main class="dashboard">
      <div class="dashboard-top">
        <h1>Dashboard</h1>
        <a id="logoutLink" href="/">Log out</a>
      </div>
      <p id="dashboardMessage">You are logged in successfully.</p>

      <form id="postForm" class="post-form">
        <h2>Create Post</h2>
        <div class="form-group">
          <label for="postImage">Post image</label>
          <div class="file-input-wrapper">
            <span class="file-input-button">Choose image</span>
            <span id="fileName" class="file-name">No file selected</span>
            <input id="postImage" name="postImage" type="file" accept="image/*">
          </div>
          <div id="imagePreview" class="image-preview"></div>
        </div>

        <div class="form-group">
          <label for="postCaption">Caption</label>
          <textarea id="postCaption" name="postCaption" placeholder="Write a caption..."></textarea>
        </div>

        <button type="submit" class="success">Add post</button>
      </form>

      <div id="postPreview" class="post-preview">
        <h2>Latest Post</h2>
        <div id="postContent" class="post-content"><p class="meta">No post added yet.</p></div>
        <div id="postsTrailer" class="posts-trailer" role="button" tabindex="0">
          <div class="trailer-list" id="trailerList"><p class="meta">Loading preview...</p></div>
          <span class="trailer-label">Click to view all posts</span>
        </div>
        <div id="allPostsList" class="all-posts hidden"></div>
      </div>
    </main>

    <section id="adminPanel" class="admin-panel">
      <h2>Created Users</h2>
      <p>Admin controls for viewing, editing, deleting, blocking, and unblocking users.</p>
      <div id="userList" class="user-list"></div>
    </section>
  </div>

  <script>
    const notification = document.getElementById("notification");
    const logoutLink = document.getElementById("logoutLink");
    const postForm = document.getElementById("postForm");
    const postImage = document.getElementById("postImage");
    const imagePreview = document.getElementById("imagePreview");
    const fileName = document.getElementById("fileName");
    const postCaption = document.getElementById("postCaption");
    const postContent = document.getElementById("postContent");
    const postsTrailer = document.getElementById("postsTrailer");
    const trailerList = document.getElementById("trailerList");
    const allPostsList = document.getElementById("allPostsList");
    const adminPanel = document.getElementById("adminPanel");
    const userList = document.getElementById("userList");
    const dashboardMessage = document.getElementById("dashboardMessage");
    const currentUser = JSON.parse(localStorage.getItem("currentUser")) || null;
    let notificationTimer;

    postImage.addEventListener("change", function () {
      try {
        const file = postImage.files[0];

        if (!file) {
          imagePreview.classList.remove("active");
          imagePreview.innerHTML = "";
          fileName.textContent = "No file selected";
          return;
        }

        fileName.textContent = file.name;

        if (!file.type.startsWith("image/")) {
          imagePreview.classList.remove("active");
          imagePreview.innerHTML = "";
          showNotification("Only image formats are allowed.");
          postImage.value = "";
          fileName.textContent = "No file selected";
          return;
        }

        const reader = new FileReader();
        reader.onload = function (e) {
          imagePreview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
          imagePreview.classList.add("active");
        };
        reader.readAsDataURL(file);
      } catch (error) {
        console.error("Image preview error:", error);
        showNotification("Could not preview the image.");
      }
    });

    async function renderSavedPost() {
      try {
        const response = await fetch("/api/posts/latest");
        if (!response.ok) {
          const text = await response.text();
          console.error("Failed to load latest post:", text);
          postContent.innerHTML = "<p class=\"meta\">No post added yet.</p>";
          return;
        }

        const data = await response.json();

        if (!data.post) {
          postContent.innerHTML = "<p class=\"meta\">No post added yet.</p>";
          return;
        }

        postContent.innerHTML = `
          <img src="${escapeHtml(data.post.image)}" alt="Post image" loading="lazy">
          <p class="post-caption">${escapeHtml(data.post.caption)}</p>
        `;
      } catch (error) {
        console.error(error);
        postContent.innerHTML = "<p class=\"meta\">No post added yet.</p>";
      }
    }

    async function renderAllPosts() {
      try {
        postsTrailer.classList.add("hidden");
        allPostsList.classList.remove("hidden");
        allPostsList.innerHTML = "<p class='meta'>Loading posts...</p>";

        const response = await fetch("/api/posts/all");
        if (!response.ok) {
          const text = await response.text();
          console.error("Failed to load posts:", text);
          allPostsList.innerHTML = "<p class='meta'>Could not load posts.</p>";
          return;
        }

        const data = await response.json();
        const posts = data.posts || [];

        if (!posts.length) {
          allPostsList.innerHTML = "<p class='meta'>No posts available yet.</p>";
          return;
        }

        allPostsList.innerHTML = posts.map(post => `
          <div class="post-item">
            <img src="${escapeHtml(post.image)}" alt="Post image" loading="lazy">
            <p class="post-caption">${escapeHtml(post.caption)}</p>
            <p class="post-author">Posted by ${escapeHtml(post.authorEmail || "Unknown")}</p>
            ${isAdmin() ? `
              <div class="post-actions">
                <span class="post-action-label">Admin action</span>
                <select class="post-action" data-id="${escapeHtml(post.id)}">
                  <option value="">Select action</option>
                  <option value="edit">Edit caption</option>
                  <option value="delete">Delete post</option>
                </select>
              </div>
            ` : ""}
          </div>
        `).join("");

        attachPostActionHandlers();
      } catch (error) {
        console.error("renderAllPosts error:", error);
        allPostsList.innerHTML = "<p class='meta'>Could not load posts.</p>";
      }
    }

    async function renderPostsTrailer() {
      try {
        trailerList.innerHTML = "<p class='meta'>Loading preview...</p>";

        const response = await fetch("/api/posts/all");
        if (!response.ok) {
          const text = await response.text();
          console.error("Failed to load trailer posts:", text);
          trailerList.innerHTML = "<p class='meta'>Unable to load preview.</p>";
          return;
        }

        const data = await response.json();
        const posts = data.posts || [];

        if (!posts.length) {
          trailerList.innerHTML = "<p class='meta'>No posts available yet.</p>";
          return;
        }

        trailerList.innerHTML = posts.slice(0, 3).map(post => `
          <div class="trailer-item">
            <img src="${escapeHtml(post.image)}" alt="Post preview" loading="lazy">
          </div>
        `).join("");
      } catch (error) {
        console.error("renderPostsTrailer error:", error);
        trailerList.innerHTML = "<p class='meta'>Unable to load preview.</p>";
      }
    }

    postsTrailer.addEventListener("click", async function () {
      await renderAllPosts();
    });

    postsTrailer.addEventListener("keypress", async function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        await renderAllPosts();
      }
    });

    function attachPostActionHandlers() {
      const actionSelects = allPostsList.querySelectorAll(".post-action");
      actionSelects.forEach(select => {
        select.addEventListener("change", async function () {
          const action = this.value;
          const postId = this.dataset.id;
          if (!action || !postId) {
            return;
          }

          if (action === "delete") {
            if (!confirm("Delete this post?")) {
              this.value = "";
              return;
            }

            try {
              await apiPost("/api/posts/delete", {
                id: postId,
                adminEmail: currentUser.email
              });
              showNotification("Post deleted successfully.", "success");
              await renderSavedPost();
              await renderAllPosts();
            } catch (error) {
              showNotification(error.message || "Could not delete post.");
            }
          }

          if (action === "edit") {
            const newCaption = prompt("Enter a new caption:", "");
            if (newCaption === null) {
              this.value = "";
              return;
            }

            try {
              await apiPost("/api/posts/update-caption", {
                id: postId,
                caption: newCaption.trim(),
                adminEmail: currentUser.email
              });
              showNotification("Caption updated successfully.", "success");
              await renderSavedPost();
              await renderAllPosts();
            } catch (error) {
              showNotification(error.message || "Could not update caption.");
            }
          }

          this.value = "";
        });
      });
    }

    postForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      try {
        const file = postImage.files[0];
        const caption = postCaption.value.trim();

        if (!file) {
          showNotification("Please choose an image.");
          return;
        }

        if (!file.type.startsWith("image/")) {
          showNotification("Only image formats are allowed.");
          postImage.value = "";
          imagePreview.classList.remove("active");
          imagePreview.innerHTML = "";
          return;
        }

        if (!caption) {
          showNotification("Please enter a caption.");
          return;
        }

        let fileToUpload = file;
        try {
          fileToUpload = await imageCompression(file, {
            maxSizeMB: 1,
            maxWidthOrHeight: 1024,
            useWebWorker: true
          });
        } catch (error) {
          console.error("Image compression failed:", error);
          showNotification("Image compression failed. Try a smaller image.");
          return;
        }

        const reader = new FileReader();

        reader.onload = async function () {
          try {
            const response = await fetch("/api/upload-post", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                image: reader.result,
                caption: caption,
                authorEmail: currentUser ? currentUser.email : null
              })
            });

            let data;
            if (!response.ok) {
              const text = await response.text();
              try {
                data = JSON.parse(text);
              } catch {
                throw new Error(text || "Upload failed.");
              }
              throw new Error(data.error || text || "Upload failed.");
            }

            data = await response.json();

            await renderSavedPost();
            await renderPostsTrailer();
            postCaption.value = "";
            postImage.value = "";
            fileName.textContent = "No file selected";
            imagePreview.classList.remove("active");
            imagePreview.innerHTML = "";
            showNotification("Post added successfully.", "success");
          } catch (error) {
            console.error("Post upload error:", error);
            showNotification(error.message || "Could not upload image.");
          }
        };

        reader.onerror = function () {
          showNotification("Could not read image.");
        };

        reader.readAsDataURL(fileToUpload);
      } catch (error) {
        console.error("Submit handler error:", error);
        showNotification("An error occurred while submitting the post.");
      }
    });

    function showNotification(text, type = "error") {
      try {
        clearTimeout(notificationTimer);
        notification.textContent = text;
        notification.classList.remove("error", "success");
        notification.classList.add(type);
        notification.classList.add("show");

        notificationTimer = setTimeout(function () {
          notification.classList.remove("show");
        }, 3000);
      } catch (error) {
        console.error("Notification error:", error);
      }
    }

    function isAdmin() {
      try {
        return currentUser && currentUser.email === "admin@gmail.com";
      } catch (error) {
        console.error("isAdmin error:", error);
        return false;
      }
    }

    function escapeHtml(value) {
      try {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      } catch (error) {
        console.error("escapeHtml error:", error);
        return "";
      }
    }

    async function apiPost(url, data) {
      try {
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          const text = await response.text();
          let errorMessage = "Request failed.";
          try {
            const body = JSON.parse(text);
            errorMessage = body.error || text || errorMessage;
          } catch {
            errorMessage = text || errorMessage;
          }
          throw new Error(errorMessage);
        }

        return response.json();
      } catch (error) {
        console.error(`API request failed (${url}):`, error);
        throw new Error(error.message || "Network request failed.");
      }
    }

    async function loadUsers() {
      try {
        const response = await fetch(`/api/users?adminEmail=${encodeURIComponent(currentUser.email)}`);

        if (!response.ok) {
          const text = await response.text();
          console.error("loadUsers response error:", text);
          showNotification("Could not load users.");
          return;
        }

        const data = await response.json();
        renderUsers(data.users || []);
      } catch (error) {
        console.error("Could not load users:", error);
        showNotification("Could not load users.");
      }
    }

    function renderUsers(users) {
      try {
        userList.innerHTML = users.map(user => {
          const createdDate = user.createdAt ? new Date(user.createdAt).toLocaleString() : "Not available";
          const isAdminUser = user.email === "admin@gmail.com";
          const statusText = user.blocked ? "Blocked" : "Active";
          const blockButtonText = user.blocked ? "Unblock" : "Block";
          const blockButtonClass = user.blocked ? "success" : "warning";

          return `
            <div class="user-card ${user.blocked ? "blocked" : ""}" data-id="${escapeHtml(user.id)}">
              <div class="user-grid">
                <div>
                  <label>Email</label>
                  <input class="edit-email" value="${escapeHtml(user.email)}" ${isAdminUser ? "disabled" : ""}>
                </div>
                <div>
                  <label>Username</label>
                  <input class="edit-username" value="${escapeHtml(user.username)}">
                </div>
                <div>
                  <label>Password</label>
                  <input class="edit-password" value="${escapeHtml(user.password)}">
                </div>
              </div>
              <p class="meta">Created: ${escapeHtml(createdDate)}</p>
              <span class="status ${user.blocked ? "blocked" : ""}">${statusText}${isAdminUser ? " Admin" : ""}</span>
              <div class="actions">
                <button type="button" onclick="updateUser('${escapeHtml(user.id)}')" ${isAdminUser ? "disabled" : ""}>Save</button>
                <button type="button" class="${blockButtonClass}" onclick="toggleBlock('${escapeHtml(user.id)}')" ${isAdminUser ? "disabled" : ""}>${blockButtonText}</button>
                <button type="button" class="danger" onclick="deleteUser('${escapeHtml(user.id)}')" ${isAdminUser ? "disabled" : ""}>Delete</button>
              </div>
            </div>
          `;
        }).join("");
      } catch (error) {
        console.error("Render users error:", error);
        userList.innerHTML = "";
        showNotification("Could not render users.");
      }
    }

    async function updateUser(id) {
      const card = document.querySelector(`[data-id="${id}"]`);

      try {
        await apiPost("/api/update-user", {
          adminEmail: currentUser.email,
          id: id,
          email: card.querySelector(".edit-email").value.trim(),
          username: card.querySelector(".edit-username").value.trim(),
          password: card.querySelector(".edit-password").value.trim()
        });

        showNotification("User updated successfully.", "success");
        await loadUsers();
      } catch (error) {
        showNotification("Could not update user.");
      }
    }

    async function toggleBlock(id) {
      try {
        await apiPost("/api/toggle-block", {
          adminEmail: currentUser.email,
          id: id
        });

        showNotification("User status changed.", "success");
        await loadUsers();
      } catch (error) {
        showNotification("Could not change user status.");
      }
    }

    async function deleteUser(id) {
      if (!confirm("Delete this user?")) {
        return;
      }

      try {
        await apiPost("/api/delete-user", {
          adminEmail: currentUser.email,
          id: id
        });

        showNotification("User deleted.", "success");
        await loadUsers();
      } catch (error) {
        showNotification("Could not delete user.");
      }
    }

    logoutLink.addEventListener("click", function (event) {
      try {
        event.preventDefault();
        localStorage.removeItem("currentUser");
        showNotification("Logged out. Redirecting...");

        setTimeout(function () {
          window.location.href = "/";
        }, 800);
      } catch (error) {
        console.error("Logout error:", error);
        showNotification("Could not log out.");
      }
    });

    if (!currentUser) {
      window.location.href = "/";
    } else {
      (async function initDashboard() {
        try {
          dashboardMessage.textContent = isAdmin()
            ? "You are logged in as admin."
            : "You are logged in successfully.";

          await renderSavedPost();
          await renderPostsTrailer();

          if (isAdmin()) {
            adminPanel.style.display = "block";
            await loadUsers();
          }
        } catch (error) {
          console.error("Dashboard initialization failed:", error);
          showNotification("Could not initialize dashboard.");
        }
      })();
    }
  </script>
</body>
</html>

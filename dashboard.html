<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .dashboard {
      width: 100%;
      max-width: 390px;
      background-color: #7F00FF;
      background-image: radial-gradient(93% 87% at 87% 89%, rgba(0, 0, 0, .23) 0, transparent 86.18%), radial-gradient(66% 66% at 26% 20%, rgba(255, 255, 255, .55) 0, rgba(255, 255, 255, 0) 69.79%, rgba(255, 255, 255, 0) 100%);
      border: 0;
      border-radius: 14px;
      padding: 32px 24px;
      box-shadow: rgba(255, 255, 255, 0.1) -3px -3px 9px inset, rgba(255, 255, 255, 0.15) 0 3px 9px inset, rgba(255, 255, 255, 0.6) 0 1px 1px inset, rgba(0, 0, 0, 0.3) 0 -8px 36px inset, rgba(255, 255, 255, 0.6) 0 1px 5px inset, rgba(0, 0, 0, 0.2) 2px 19px 31px;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    p {
      color: #e5d7f5;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      color: #fff;
      padding: 15px 25px;
      border-radius: 14px;
      font-weight: bold;
      font-size: 16px;
      border: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      cursor: pointer;
      box-shadow: rgba(255, 255, 255, 0.1) -3px -3px 9px inset, rgba(255, 255, 255, 0.15) 0 3px 9px inset, rgba(255, 255, 255, 0.6) 0 1px 1px inset, rgba(0, 0, 0, 0.3) 0 -8px 36px inset, rgba(255, 255, 255, 0.6) 0 1px 5px inset, rgba(0, 0, 0, 0.2) 2px 19px 31px;
      background-color: #7F00FF;
      background-image: radial-gradient(93% 87% at 87% 89%, rgba(0, 0, 0, .23) 0, transparent 86.18%), radial-gradient(66% 66% at 26% 20%, rgba(255, 255, 255, .55) 0, rgba(255, 255, 255, 0) 69.79%, rgba(255, 255, 255, 0) 100%);
      text-decoration: none;
      transition: all 150ms ease-in-out;
    }

    a:hover {
      filter: brightness(1.05);
    }

    a:active {
      transform: scale(.95);
    }

    @media (max-width: 360px) {
      body {
        padding: 16px;
      }

      .dashboard {
        padding: 28px 18px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>
<body>
  <main class="dashboard">
    <h1>Dashboard</h1>
    <p>You are logged in successfully.</p>
    <a href="/">Log out</a>
  </main>
</body>
</html>

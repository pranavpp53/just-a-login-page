<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #000000;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-screen {
      width: 100%;
      max-width: 390px;
      background-color: #7F00FF;
      background-image: radial-gradient(93% 87% at 87% 89%, rgba(0, 0, 0, .23) 0, transparent 86.18%), radial-gradient(66% 66% at 26% 20%, rgba(255, 255, 255, .55) 0, rgba(255, 255, 255, 0) 69.79%, rgba(255, 255, 255, 0) 100%);
      border: 0;
      border-radius: 14px;
      padding: 32px 24px;
      box-shadow: rgba(255, 255, 255, 0.1) -3px -3px 9px inset, rgba(255, 255, 255, 0.15) 0 3px 9px inset, rgba(255, 255, 255, 0.6) 0 1px 1px inset, rgba(0, 0, 0, 0.3) 0 -8px 36px inset, rgba(255, 255, 255, 0.6) 0 1px 5px inset, rgba(0, 0, 0, 0.2) 2px 19px 31px;
    }

    .brand {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      background: #246bfe;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #c9d0dc;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    label {
      display: block;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 1em;
      padding: 0 14px;
      font-size: 16px;
      color: #ffffff;
      background: #7F00FF;
      background-image: radial-gradient(93% 87% at 87% 89%, rgba(0, 0, 0, .23) 0, transparent 86.18%), radial-gradient(66% 66% at 26% 20%, rgba(255, 255, 255, .35) 0, rgba(255, 255, 255, 0) 69.79%, rgba(255, 255, 255, 0) 100%);
      margin-bottom: 18px;
      box-shadow: none;
    }

    input:focus {
      outline: none;
      box-shadow: none;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 2px 0 24px;
      font-size: 14px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #d7deea;
      white-space: nowrap;
    }

    .remember input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #246bfe;
    }

    a {
      color: #246bfe;
      text-decoration: none;
      font-weight: 700;
    }

    button {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 8px;
      background: #246bfe;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    .signup {
      text-align: center;
      color: #c9d0dc;
      font-size: 14px;
      margin-top: 24px;
    }

    .message {
      color: #ffffff;
      font-size: 14px;
      margin-top: 16px;
      min-height: 20px;
      text-align: center;
    }

    @media (max-width: 360px) {
      body {
        padding: 16px;
      }

      .login-screen {
        padding: 28px 18px;
      }

      h1 {
        font-size: 25px;
      }

      .row {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    .button-38 {
      color: #fff;
      padding: 15px 25px;
      border-radius: 14px;
      font-weight: bold;
      font-size: 16px;
      border: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      cursor: pointer;
      box-shadow: rgba(255, 255, 255, 0.1) -3px -3px 9px inset, rgba(255, 255, 255, 0.15) 0 3px 9px inset, rgba(255, 255, 255, 0.6) 0 1px 1px inset, rgba(0, 0, 0, 0.3) 0 -8px 36px inset, rgba(255, 255, 255, 0.6) 0 1px 5px inset, rgba(0, 0, 0, 0.2) 2px 19px 31px;
      background-color: #7F00FF;
      background-image: radial-gradient(93% 87% at 87% 89%, rgba(0, 0, 0, .23) 0, transparent 86.18%), radial-gradient(66% 66% at 26% 20%, rgba(255, 255, 255, .55) 0, rgba(255, 255, 255, 0) 69.79%, rgba(255, 255, 255, 0) 100%);
      transition: all 150ms ease-in-out;
    }

    .button-38:hover {
      filter: brightness(1.05);
    }

    .button-38:active {
      transform: scale(.95);
    }

  </style>
</head>
<body>
  <main class="login-screen">
    <div class="brand">L</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue to your account.</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter your password" required>

      <div class="row">
        <label class="remember">
          <input id="remember" name="remember" type="checkbox">
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button class="button-38" type="submit">Log in</button>
    </form>
    <p id="message" class="message"></p>

    <p class="signup">New here? <a href="/signup">Create account</a></p>
  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const users = JSON.parse(localStorage.getItem("users")) || [];
      const matchedUser = users.find(user =>
        user.email === email &&
        user.password === password
      );

      if (!matchedUser) {
        message.textContent = "Invalid email or password.";
        return;
      }

      localStorage.setItem("loggedInUser", JSON.stringify(matchedUser));
      window.location.href = "/dashboard";
    });
  </script>
</body>
</html>
